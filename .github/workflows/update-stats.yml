name: Update profile stats

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - generate-stats.sh
      - .github/workflows/update-stats.yml

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats SVGs
        env:
          # PAT with read access to private repos; GITHUB_TOKEN only sees public ones.
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: ./generate-stats.sh

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain stats/)" ]; then
            echo "Stats unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/
          git commit -m "chore: update profile stats [skip ci]"
          git push
